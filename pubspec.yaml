name: amusic
description: "aMusic - a cross-platform NetEase Cloud Music client."
publish_to: 'none'

version: 2.0.0+20

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # routing
  go_router: ^18.1.1

  # network + NetEase request encryption (eapi / weapi)
  dio: ^5.11.1
  crypto: ^3.0.6
  pointycastle: ^4.0.0

  # audio
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  # Windows / Linux backend (no-op on other platforms)
  just_audio_media_kit: ^2.1.0
  media_kit_libs_audio: ^1.0.7

  # storage
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

  # ui
  qr_flutter: ^4.1.0
  palette_generator: ^0.3.3+7

  # desktop
  window_manager: ^0.5.2

  # misc
  package_info_plus: ^10.2.2
  collection: ^1.19.0
  file_selector: 1.1.0
  permission_handler: 12.0.1
  url_launcher: 6.3.2
  gal: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

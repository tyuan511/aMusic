name: amusic
description: "aMusic - a cross-platform NetEase Cloud Music client."
publish_to: 'none'

version: 2.0.6+26

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # routing
  go_router: ^18.1.1

  # network + NetEase request encryption (eapi / weapi)
  dio: ^5.11.1
  crypto: ^3.0.6

  # audio
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  # Rust audio engine, the just_audio backend on every platform
  # (see packages/amusic_engine).
  amusic_engine:
    path: packages/amusic_engine

  # storage
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

  # ui
  qr_flutter: ^4.1.0

  # desktop
  window_manager: ^0.5.2

  # misc
  package_info_plus: ^10.2.2
  collection: ^1.19.0
  file_selector: 1.1.0
  # 13.x pulls permission_handler_android 14.x, which compiles against
  # compileSdk 37. Google only ships that platform as "android-37.0" (SDK XML
  # v4) and the AGP these plugin subprojects resolve with cannot read it, so
  # `flutter build apk` dies with "Failed to find target with hash string
  # 'android-37'". Stay on the newest 12.x until that is fixable.
  permission_handler: ^12.0.3
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # just_audio's StreamAudioSource is the only way to resolve NetEase stream
    # urls lazily; the experimental marker is expected and accepted here.
    experimental_member_use: ignore

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    unnecessary_lambdas: true
    avoid_print: true

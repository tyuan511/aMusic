group = "com.tangge.amusic_engine"
version = "1.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.tangge.amusic_engine"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }
    defaultConfig {
        minSdk = 26 // AAudio
    }
}

// Builds the Rust engine for the ABIs of the app being assembled. Flutter
// passes them as `target-platform` (e.g. "android-arm64,android-arm").
def abis = []
def targetPlatform = project.findProperty("target-platform") ?: "android-arm64,android-arm,android-x64"
targetPlatform.split(",").each {
    switch (it.trim()) {
        case "android-arm64": abis << "arm64-v8a"; break
        case "android-arm": abis << "armeabi-v7a"; break
        case "android-x64": abis << "x86_64"; break
    }
}

tasks.register("buildRustEngine", Exec) {
    // The NDK dir is only known once the android extension is evaluated.
    doFirst {
        commandLine("sh", "${projectDir}/build_rust.sh",
                android.ndkDirectory.absolutePath, android.defaultConfig.minSdk.toString(), *abis)
    }
    inputs.dir("${projectDir}/../rust/src")
    inputs.file("${projectDir}/../rust/Cargo.toml")
    outputs.dir("${projectDir}/src/main/jniLibs")
}

preBuild.dependsOn("buildRustEngine")

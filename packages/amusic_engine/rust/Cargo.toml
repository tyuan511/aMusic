[package]
name = "amusic_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "flac", "isomp4", "ogg", "vorbis", "wav", "alac", "pcm", "mkv", "adpcm"] }
ureq = { version = "3.5.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4"
ndk-context = "0.1"

[dev-dependencies]
hound = "3.5.1"
libc = "0.2.191"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

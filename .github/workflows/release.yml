name: release

# Packages every platform. The audio engine is Rust (packages/amusic_engine/rust)
# and is compiled by each platform's own build (Gradle task, CocoaPods script
# phase, CMake), so every job only has to provide the Rust toolchain and the
# targets that platform builds for.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ENGINE_CRATE: packages/amusic_engine/rust

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # AGP 9 / Gradle 9 need JDK 17 or newer.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.ENGINE_CRATE }}
      - run: flutter pub get
      - name: Build the signed apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          flutter build apk --release --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: build/app/outputs/flutter-apk/*.apk
      - uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/*.apk
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  macos:
    # Apple silicon runner; the app is built universal (arm64 + x86_64).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.ENGINE_CRATE }}
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/amusic.app aMusic-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: aMusic-macos.zip
      - uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aMusic-macos.zip
          tag: ${{ github.ref }}
          overwrite: true

  ios:
    # Unsigned: re-sign it (or build with your own profile) before installing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.ENGINE_CRATE }}
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Make the ipa
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry aMusic-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: aMusic-ios-unsigned.ipa
      - uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aMusic-ios-unsigned.ipa
          tag: ${{ github.ref }}
          overwrite: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The MSVC toolchain is what CMake's cargo step expects.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.ENGINE_CRATE }}
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath aMusic-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: aMusic-windows-x64.zip
      - uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aMusic-windows-x64.zip
          tag: ${{ github.ref }}
          overwrite: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libasound2-dev: the Rust engine's ALSA output.
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libasound2-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.ENGINE_CRATE }}
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack the bundle
        run: tar -C build/linux/x64/release/bundle -czf aMusic-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: aMusic-linux-x64.tar.gz
      - uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aMusic-linux-x64.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
